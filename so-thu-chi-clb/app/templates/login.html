{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Đăng nhập</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Tên đăng nhập
      <input type="text" name="username" value="{{ username }}" autofocus>
    </label>
    <label>Mật khẩu
      <input type="password" name="password">
    </label>
    <button type="submit">Đăng nhập</button>
  </form>
  <p class="hint">Tài khoản thử: <code>thuquy</code> (thủ quỹ) hoặc <code>thanhvien</code> (thành viên). Mật khẩu xem trong README.</p>
</section>
{% endblock %}
